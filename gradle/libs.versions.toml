navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
work = "2.11.2"
startup = "1.2.0"
glance = "1.2.0"
media3 = "1.11.1"
camerax = "1.6.2"
mlkitBarcode = "17.3.0"
mlkitLabeling = "17.0.9"
mlkitInk = "19.0.0"
gmsWearable = "19.0.0"
gmsLocation = "21.4.0"
coroutines = "1.11.0"
serialization = "1.13.0"
okhttp = "5.3.2"
osmdroid = "6.1.20"
